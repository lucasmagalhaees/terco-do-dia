<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Terço do Dia</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#16110d">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
/* Layout: uma tela só, coluna única; topo com progresso, centro com a oração, base com o botão grande. */
:root{
  --bg:#f2ead9; --card:#faf4e6; --ink:#2b2117; --muted:#74685a; --line:#d8cbb0;
  --accent:#8c2a3a; --on-accent:#ffffff;
  --display:"Cinzel","Trajan Pro",Georgia,serif;
  --body:"EB Garamond",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16110d; --card:#211a13; --ink:#ece1cc; --muted:#a39580; --line:#3b3023; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16110d; --card:#211a13; --ink:#ece1cc; --muted:#a39580; --line:#3b3023; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{height:100vh;height:100svh;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:20px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
#app{height:100vh;height:100svh;display:flex;flex-direction:column;max-width:640px;margin:0 auto;
  padding:max(env(safe-area-inset-top),14px) max(env(safe-area-inset-right),18px) max(env(safe-area-inset-bottom),14px) max(env(safe-area-inset-left),18px)}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:8px 0 18px}
.eyebrow{font-family:var(--display);font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:0}
h1,h2{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.02em}
h1{font-size:clamp(1.9rem,8vw,2.6rem);line-height:1.12}
h2{font-size:clamp(1.35rem,5.5vw,1.7rem);line-height:1.2}
.rule{height:3px;width:56px;background:var(--accent);border-radius:2px;margin:14px 0 18px}

/* segmented control */
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.seg button{flex:1;border:0;background:none;padding:11px 8px;font-size:.95rem;min-height:44px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}

/* home */
.list{list-style:none;margin:0 0 18px;padding:0;counter-reset:m}
.list li{counter-increment:m;display:flex;gap:14px;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--line)}
.list li::before{content:counter(m,upper-roman);font-family:var(--display);font-size:.85rem;color:var(--accent);min-width:2.2em}
.list .la{display:block;font-style:italic;color:var(--muted);font-size:.9em}
.list li.grp{counter-reset:m;border:0;padding:16px 0 2px}
.list li.grp::before{content:""}
.list .gh{font-family:var(--display);font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:.9rem;min-height:40px}
.chip[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.chip small{color:var(--muted)}
.label{margin:18px 0 8px}

/* buttons */
.btn{width:100%;min-height:58px;border-radius:14px;border:0;background:var(--accent);color:var(--on-accent);
  font-family:var(--display);font-size:1rem;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line);min-height:50px;font-size:.85rem}
.row{display:flex;gap:10px}
.row .btn.ghost{width:auto;padding:0 18px;flex:0 0 auto}
.row .btn:not(.ghost){flex:1}
.stack{display:flex;flex-direction:column;gap:10px}

/* prayer view */
.top{display:flex;align-items:center;gap:12px;padding-bottom:10px}
.top .exit{border:1px solid var(--line);background:var(--card);border-radius:10px;min-width:44px;min-height:44px;font-size:1.1rem}
.prog{flex:1;display:flex;gap:6px}
.prog i{flex:1;height:6px;border-radius:3px;background:var(--line);position:relative;overflow:hidden}
.prog i.done{background:var(--accent)}
.prog i.cur::after{content:"";position:absolute;inset:0;background:var(--accent);width:var(--p,0%)}
.where{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px 10px;margin:2px 0 4px}
.myst{margin:6px 0 14px}
.myst .la{display:block;font-style:italic;font-weight:400;font-family:var(--body);font-size:.95rem;letter-spacing:0;color:var(--muted);margin-top:4px}
.prayer{margin:0 0 .9em;font-size:clamp(1.22rem,4.8vw,1.42rem);line-height:1.55;max-width:34rem}
.prayer.pt2{font-size:1.05rem;color:var(--muted);font-style:italic;margin-top:-.2em}
.note{color:var(--muted);font-style:italic;margin:0 0 .8em}
.beads{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;padding:6px 0 14px}
.beads b{width:22px;height:22px;border-radius:50%;border:2px solid var(--accent);background:transparent;transition:background .18s}
.beads b.on{background:var(--accent)}
.count{font-family:var(--display);text-align:center;color:var(--muted);letter-spacing:.12em;font-size:.8rem;margin-bottom:6px}
.done-screen{flex:1;display:flex;flex-direction:column;justify-content:center;gap:6px}
.amen{font-family:var(--display);font-size:clamp(3rem,16vw,4.6rem);color:var(--accent);margin:0;line-height:1}
/* terço virtual */
.ros{display:block;flex:0 0 auto;width:100%;height:128px;padding:0;margin:0 0 8px;border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden;transition:height .35s ease}
.ros.big{height:min(46vh,360px)}
.ros svg{display:block;width:100%;height:100%}
.ros:not(.big) svg{-webkit-mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent);mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent)}
.ros .string{fill:none;stroke:var(--line);stroke-width:1.4}
.ros .bd{fill:var(--card);stroke:var(--muted);stroke-width:1.2;transform-box:fill-box;transform-origin:center;transition:fill .35s,stroke .35s,transform .35s cubic-bezier(.3,1.6,.5,1)}
.ros .done .bd{fill:var(--accent);stroke:var(--accent)}
.ros .cur .bd{fill:var(--accent);stroke:var(--ink);stroke-width:1.6;transform:scale(1.3)}
.ros .ring{fill:none;stroke:var(--accent);stroke-width:1.4;opacity:0;transform-box:fill-box;transform-origin:center}
.ros .cur .ring{animation:pulse var(--pulse,1.9s) ease-out infinite}
.where{align-items:center}
.ctl{display:flex;gap:6px}
.mini{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:.8rem;min-height:36px;white-space:nowrap}
.mini[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.pace{align-self:center;font-size:.8rem;color:var(--muted);min-width:34px;text-align:center;font-variant-numeric:tabular-nums}
.med{margin:4px 0 8px;font-style:italic;color:var(--ink);font-size:1.18rem;line-height:1.55}
.med .ref{font-style:normal;font-family:var(--display);font-size:.72rem;letter-spacing:.06em;color:var(--accent);margin-right:6px}
.fruit{margin:0 0 6px;font-size:.82rem;color:var(--muted)}
.timerow{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;margin:0 0 10px}
.timerow span{font-size:.92rem;color:var(--muted)}
.timesel{display:flex;align-items:center;gap:4px}
.timesel select{font:inherit;font-size:1.1rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;color-scheme:light dark}
.timesel b{color:var(--muted)}
.streak{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:14px;margin:18px 0 4px}
.sline{display:flex;align-items:center;gap:14px}
.snum{font-family:var(--display);font-weight:600;font-size:2.3rem;line-height:1;color:var(--accent);min-width:1.5em;text-align:center;font-variant-numeric:tabular-nums}
.sbig{margin:0;font-weight:600}
.ssub{margin:2px 0 0;font-size:.82rem;color:var(--muted)}
.sicon{font-size:2.1rem;line-height:1;align-self:center}
.clock{display:flex;align-items:center;justify-content:center;gap:10px;padding:0 0 8px}
#clocktime{font-family:var(--display);font-size:1.05rem;letter-spacing:.1em;color:var(--muted);font-variant-numeric:tabular-nums}
.clklock{border:1px solid var(--line);background:var(--card);border-radius:8px;min-width:34px;min-height:30px;font-size:.85rem;line-height:1}
.clklock.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.arow{display:flex;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line)}
.arow.locked{opacity:.38}
.adate{font-family:var(--display);font-size:.78rem;color:var(--accent);min-width:3.4em;font-variant-numeric:tabular-nums}
.aname{font-size:1rem}
.santo{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;margin:16px 0 2px}
.sname{margin:2px 0 0;font-family:var(--display);font-size:1.05rem;color:var(--ink)}
.tiers{display:flex;gap:8px;margin:12px 0 2px}
.tier{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border:1px solid var(--line);border-radius:10px;opacity:.4}
.tier.got{opacity:1;border-color:var(--accent)}
.tier .ti{font-size:1.4rem;line-height:1}
.tier .tn{font-size:.7rem;color:var(--muted)}
.dots{display:flex;gap:6px;margin:12px 0 2px}
.dots i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.dots i.on{background:var(--accent)}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{font-size:.78rem;border:1px solid var(--line);border-radius:999px;padding:5px 11px;color:var(--muted);opacity:.55}
.badge.got{opacity:1;color:var(--ink);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.emblem{display:flex;justify-content:center;margin:0 0 8px}
.emblem svg{width:56px;height:56px}
.vr{margin:0 0 12px;line-height:1.5;font-size:1.05rem}
.vr b{color:var(--accent);font-family:var(--display);margin-right:5px}
@keyframes pulse{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.9);opacity:0}}
@media (prefers-reduced-motion: reduce){ .beads b,.ros,.ros .bd{transition:none} .ros .cur .ring{animation:none;opacity:.8} }
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ---------- Conteúdo ---------- */
var PRAYERS = {
  sinal:{ name:{pt:'Sinal da Cruz',la:'Signum Crucis'},
    pt:'Em nome do Pai, e do Filho, e do Espírito Santo. Amém.',
    la:'In nómine Patris, et Fílii, et Spíritus Sancti. Amen.' },
  pelosinal:{ name:{pt:'Pelo sinal da Santa Cruz',la:'Per signum Crucis'},
    pt:'Pelo sinal da Santa Cruz, livrai-nos, Deus Nosso Senhor, dos nossos inimigos. Em nome do Pai, e do Filho e do Espírito Santo. Amém.',
    la:'Per signum Crucis de inimícis nostris líbera nos, Deus noster. In nómine Patris, et Fílii, et Spíritus Sancti. Amen.' },
  oferecimento:{ name:{pt:'Oferecimento',la:'Oblatio'},
    pt:'Divino Jesus, nós Vos oferecemos este terço que vamos rezar, meditando nos mistérios da nossa Redenção. Concedei-nos, por intercessão da Virgem Maria, a quem nos dirigimos, Mãe de Deus e nossa Mãe, as virtudes que nos são necessárias para bem rezá-lo e a graça de ganharmos as indulgências desta santa devoção. Oferecemos particularmente, em desagravo dos pecados cometidos contra o Santíssimo Coração de Jesus e Imaculado Coração de Maria, pela paz do mundo, pela conversão dos pecadores, pelas almas do Purgatório, pela Fé que anima a vossa Igreja, pelas intenções do Santo Padre, pelo aumento e santificação do Clero, pela santificação das famílias, pelos doentes, pelos agonizantes, pelo Brasil, por todos aqueles que são oprimidos nos regimes ditatoriais de seus países, e por todas as nossas intenções particulares.',
    la:'' },
  credo:{ name:{pt:'Creio em Deus Pai',la:'Credo'},
    pt:'Creio em Deus Pai todo-poderoso, criador do céu e da terra; e em Jesus Cristo, seu único Filho, nosso Senhor, que foi concebido pelo poder do Espírito Santo, nasceu da Virgem Maria, padeceu sob Pôncio Pilatos, foi crucificado, morto e sepultado; desceu à mansão dos mortos; ressuscitou ao terceiro dia; subiu aos céus, está sentado à direita de Deus Pai todo-poderoso, donde há de vir a julgar os vivos e os mortos. Creio no Espírito Santo, na santa Igreja Católica, na comunhão dos santos, na remissão dos pecados, na ressurreição da carne, na vida eterna. Amém.',
    la:'Credo in Deum Patrem omnipoténtem, Creatórem cæli et terræ. Et in Iesum Christum, Fílium eius unicum, Dóminum nostrum, qui conceptus est de Spíritu Sancto, natus ex María Vírgine, passus sub Póntio Piláto, crucifíxus, mórtuus, et sepúltus, descéndit ad ínferos; tértia die resurréxit a mórtuis; ascéndit ad cælos, sedet ad déxteram Dei Patris omnipoténtis; inde ventúrus est iudicáre vivos et mórtuos. Credo in Spíritum Sanctum, sanctam Ecclésiam cathólicam, sanctórum communiónem, remissiónem peccatórum, carnis resurrectiónem, vitam ætérnam. Amen.' },
  pai:{ name:{pt:'Pai Nosso',la:'Pater Noster'},
    pt:'Pai nosso, que estais nos céus, santificado seja o vosso nome; venha a nós o vosso reino; seja feita a vossa vontade, assim na terra como no céu. O pão nosso de cada dia nos dai hoje; perdoai-nos as nossas ofensas, assim como nós perdoamos a quem nos tem ofendido; e não nos deixeis cair em tentação, mas livrai-nos do mal. Amém.',
    la:'Pater noster, qui es in cælis, sanctificétur nomen tuum; advéniat regnum tuum; fiat volúntas tua, sicut in cælo et in terra. Panem nostrum cotidiánum da nobis hódie; et dimítte nobis débita nostra, sicut et nos dimíttimus debitóribus nostris; et ne nos indúcas in tentatiónem; sed líbera nos a malo. Amen.' },
  ave:{ name:{pt:'Ave Maria',la:'Ave Maria'},
    pt:'Ave Maria, cheia de graça, o Senhor é convosco; bendita sois vós entre as mulheres e bendito é o fruto do vosso ventre, Jesus. Santa Maria, Mãe de Deus, rogai por nós, pecadores, agora e na hora de nossa morte. Amém.',
    la:'Ave María, grátia plena, Dóminus tecum; benedícta tu in muliéribus, et benedíctus fructus ventris tui, Iesus. Sancta María, Mater Dei, ora pro nobis peccatóribus, nunc et in hora mortis nostræ. Amen.' },
  gloria:{ name:{pt:'Glória',la:'Glória Patri'},
    pt:'Glória ao Pai, e ao Filho, e ao Espírito Santo. Como era no princípio, agora e sempre. Amém.',
    la:'Glória Patri, et Fílio, et Spirítui Sancto. Sicut erat in princípio, et nunc, et semper, et in sǽcula sæculórum. Amen.' },
  fatima:{ name:{pt:'Ó meu Jesus',la:'O mi Iesu'},
    pt:'Ó meu Bom Jesus, perdoai-nos, livrai-nos do fogo do inferno, levai as almas todas para o Céu e socorrei principalmente aquelas que mais precisarem da Vossa infinita misericórdia.',
    la:'O mi Iesu, dimítte nobis débita nostra, salva nos ab igne inférni, perdúc in cælum omnes ánimas, præsértim eas, quæ misericórdiæ tuæ máxime indigent.' },
  anjo:{ name:{pt:'Oração do Anjo (Fátima)',la:'Oratio Angeli'},
    pt:'Meu Deus, eu creio, adoro, espero e amo-Vos. Peço-Vos perdão para os que não creem, não adoram, não esperam e não Vos amam.',
    la:'' },
  defuntos:{ name:{pt:'Pelas almas do purgatório',la:'Réquiem ætérnam'},
    pt:'Dai-lhes, Senhor, o descanso eterno, e brilhe para elas a luz perpétua. Descansem em paz. Amém.',
    la:'Réquiem ætérnam dona eis, Dómine, et lux perpétua lúceat eis. Requiéscant in pace. Amen.' },
  veni:{ name:{pt:'Vinde, Espírito Santo',la:'Veni, Sancte Spíritus'},
    pt:'Vinde, Espírito Santo, enchei os corações dos vossos fiéis e acendei neles o fogo do vosso amor. Enviai o vosso Espírito e tudo será criado, e renovareis a face da terra.',
    la:'Veni, Sancte Spíritus, reple tuórum corda fidélium, et tui amóris in eis ignem accénde. Emítte Spíritum tuum, et creabúntur; et renovábis fáciem terræ.' },
  gracas:{ name:{pt:'Infinitas graças',la:'Infinitas graças'},
    pt:'Infinitas graças vos damos, ó soberana Rainha, pelos benefícios que todos os dias recebemos de vossas mãos. Dignai-vos, agora e sempre, tomar-nos debaixo da vossa proteção; e, para mais vos obsequiarmos, vos saudamos com uma Salve Rainha.',
    la:'' },
  salve:{ name:{pt:'Salve Rainha',la:'Salve Regína'},
    pt:'Salve, Rainha, Mãe de misericórdia, vida, doçura e esperança nossa, salve! A vós bradamos, os degredados filhos de Eva; a vós suspiramos, gemendo e chorando neste vale de lágrimas. Eia, pois, advogada nossa, esses vossos olhos misericordiosos a nós volvei; e depois deste desterro mostrai-nos Jesus, bendito fruto do vosso ventre, ó clemente, ó piedosa, ó doce sempre Virgem Maria. Rogai por nós, Santa Mãe de Deus, para que sejamos dignos das promessas de Cristo. Amém.',
    la:'Salve, Regína, Mater misericórdiæ, vita, dulcédo, et spes nostra, salve. Ad te clamámus, éxsules fílii Hevæ. Ad te suspirámus, geméntes et flentes in hac lacrimárum valle. Eia ergo, Advocáta nostra, illos tuos misericórdes óculos ad nos convérte. Et Iesum, benedíctum fructum ventris tui, nobis post hoc exsílium osténde. O clemens, O pia, O dulcis Virgo María. Ora pro nobis, sancta Dei Génetrix. Ut digni efficiámur promissiónibus Christi. Amen.' }
};

var SETS = {
  gozosos:{ short:'Gozosos', name:{pt:'Mistérios Gozosos',la:'Mystéria Gaudii'}, days:'segunda e sábado', acc:'#d3a437', on:'#2b2117', items:[
    {pt:'A Anunciação do Anjo a Maria',la:'Annuntiátio Angeli ad Maríam',ref:'Lc 1,26-38',fruto:'Humildade',med:'Neste mistério contemplamos o Anjo Gabriel anunciar a Maria que ela será a Mãe de Deus, e o seu sim: "Faça-se em mim segundo a vossa palavra."'},
    {pt:'A Visitação de Maria a Isabel',la:'Visitátio Maríæ ad Elísabeth',ref:'Lc 1,39-56',fruto:'Caridade',med:'Neste mistério contemplamos Maria visitar sua prima Isabel, que a saúda bendita entre as mulheres, e o seu cântico, o Magnificat.'},
    {pt:'O Nascimento de Jesus em Belém',la:'Nativitas Dómini in Béthlehem',ref:'Lc 2,1-20',fruto:'Pobreza',med:'Neste mistério contemplamos o nascimento de Jesus em Belém, deitado numa manjedoura e adorado pelos pastores.'},
    {pt:'A Apresentação de Jesus no Templo',la:'Præsentátio Iesu in Templo',ref:'Lc 2,22-39',fruto:'Obediência',med:'Neste mistério contemplamos Maria e José apresentarem Jesus no Templo, reconhecido por Simeão como luz dos povos.'},
    {pt:'O Encontro do Menino Jesus no Templo',la:'Invéntio Púeri Iesu in Templo',ref:'Lc 2,41-52',fruto:'Busca de Jesus',med:'Neste mistério contemplamos Maria e José encontrarem, após três dias, o Menino Jesus no Templo, entre os doutores.'}]},
  luminosos:{ short:'Luminosos', name:{pt:'Mistérios Luminosos',la:'Mystéria Lucis'}, days:'quinta-feira', acc:'#3f73b0', on:'#ffffff', items:[
    {pt:'O Batismo de Jesus no Jordão',la:'Baptísmus Iesu in Iordáne',ref:'Mt 3,13-17',fruto:'Fidelidade ao Batismo',med:'Neste mistério contemplamos o Batismo de Jesus no Jordão, quando o Pai o proclama: "Este é o meu Filho amado."'},
    {pt:'As Bodas de Caná',la:'Núptiæ in Cana',ref:'Jo 2,1-12',fruto:'Confiança em Maria',med:'Neste mistério contemplamos as bodas de Caná, onde, por intercessão de Maria, Jesus transforma a água em vinho: "Fazei tudo o que Ele vos disser."'},

  while(set[dayISO(d)]){ cur++; d.setDate(d.getDate()-1); }
  var dates=Object.keys(set).sort(), best=0, run=0, prev=null;

function curBead(){
  var st=STEPS[S.i], k=st.k, d=st.dec, has=(typeof d==='number');
  if(k==='credo'||k==='pelosinal'||k==='oferecimento'||k==='veni'||(k==='sinal'&&!st.end)) return {id:'cross',p:0};
  if(k==='pai'&&!has) return {id:'A1',p:1};
  if(k==='ave'&&!has) return {id:'t'+S.c,p:2+S.c};
  if(k==='gloria'&&!has) return {id:'B',p:5};
  if(k==='fatima'&&!has) return {id:'B',p:5};
  if(k==='pai') return d===0 ? {id:'medal',p:6} : {id:'L'+(d-1),p:7+(d-1)*11+10};
  if(k==='ave') return {id:'d'+d+'_'+S.c,p:7+d*11+S.c};
  if(k==='gloria'||k==='fatima') return {id:'L'+d,p:7+d*11+10};
  if(k==='salve'||k==='gracas'||k==='anjo'||k==='defuntos') return {id:'medal',p:62};
  return {id:'cross',p:63};
}
function updateRosary(){

var autoTimer=0;
function delayFor(){
  var st=STEPS[S.i], p=PRAYERS[st.k], w=(S.lang==='pt'?p.pt:p.la).split(/\s+/).length;

var ORDPT=['Primeiro','Segundo','Terceiro','Quarto','Quinto'];
function stepSpeech(){
  var st=STEPS[S.i], p=PRAYERS[st.k], pt=(S.lang==='pt'), txt='';
  if(st.firstOfSet && S.mode==='rosario'){ txt+= (pt?SETS[st.setKey].name.pt:SETS[st.setKey].name.la)+'. '; }

  txt+= pt ? p.pt : p.la;

function chunks(t){
  var parts=t.match(/[^.;!?]+[.;!?]*/g)||[t], out=[], cur='';
  parts.forEach(function(x){
    x=x.trim(); if(!x) return;
    if(cur && (cur+' '+x).length>170){ out.push(cur); cur=x; } else cur=cur?cur+' '+x:x;
  });
  if(cur) out.push(cur);
  return out;
}
function voiceList(pt){
  var all=window.speechSynthesis.getVoices(), pre=pt?'pt':'it';
  var list=all.filter(function(v){ return v.lang.toLowerCase().replace('_','-').indexOf(pre)===0; });
  if(pt){ var br=list.filter(function(v){ return /pt-br/i.test(v.lang.replace('_','-')); }); if(br.length) list=br; }
  return list;

function narrate(text, tok, done){
  var ss=window.speechSynthesis;
  if(!ss){ done(false); return; }
  var _ss=ss, pt=(S.lang==='pt'), list=voiceList(pt), v=pickVoice(list,S.voice),
      parts=chunks(text), i=0, started=false;
  function one(){
    if(tok!==speakTok) return;
    if(i>=parts.length){ done(true); return; }
    var first=(i===0), u=new SpeechSynthesisUtterance(parts[i++]), wd=0;
    u.lang=pt?'pt-BR':'it-IT';
    u.voice=v||list[0]||null;
    u.pitch=v?1:(S.voice==='f'?1.15:0.8);
    u.rate=0.8;
    u.onstart=function(){ started=true; clearTimeout(wd); };
    u.onend=function(){ clearTimeout(wd); one(); };
    u.onerror=function(e){
      clearTimeout(wd);
      if(tok!==speakTok) return;
      if(e&&(e.error==='interrupted'||e.error==='canceled')) return;
      done(false);
    };

    ss.speak(u);

function schedule(){
  clearTimeout(autoTimer);

    autoTimer=setTimeout(function(){
      narrate(stepSpeech(), tok, function(ok){
        if(tok!==speakTok||!(S.auto||S.say)) return;
        autoTimer=setTimeout(next, ok?gap:delayFor());
      });
    },150);

    autoTimer=setTimeout(next, delayFor());
  }

  speakTok++;
  if('speechSynthesis' in window) speechSynthesis.cancel();
  applyTheme();
  applyAccent();
  if(S.view==='home') home(); else if(S.view==='pray'){ pray(); schedule(); } else if(S.view==='angelus') angelusView(); else if(S.view==='album') albumView(); else done();
  app.insertAdjacentHTML('afterbegin', clockBar());
}

/* ---------- Ações ---------- */
function next(){
  var st=STEPS[S.i];
  if(st.count){
    S.c++;
    if(S.c>=st.count){ S.c=0; S.i++; }
  } else {
    if(S.i>=STEPS.length-1){ recordCompletion(); S.view='done'; S.started=false; S.i=0; S.c=0; save(); render(); return; }
    S.i++;
  }
  save(); render();
}
function back(){
  var st=STEPS[S.i];
  if(st.count && S.c>0){ S.c--; }
  else if(S.i>0){
    S.i--; var pv=STEPS[S.i];
    S.c = pv.count ? pv.count-1 : 0;
  }
  save(); render();
}
function start(){ STEPS=build(S.set); S.i=0; S.c=0; S.started=true; S.view='pray'; save(); render(); }

app.addEventListener('click', function(e){
  var t=e.target.closest('button'); if(!t) return;
  if(t.dataset.voice){ S.voice=t.dataset.voice; save(); render(); return; }
  if(t.dataset.themeOpt){ S.theme=t.dataset.themeOpt; save(); render(); return; }
  if(t.dataset.lang){ S.lang=t.dataset.lang; save(); render(); return; }
  if(t.dataset.mode){
    if(t.dataset.mode!==S.mode){ S.mode=t.dataset.mode; S.started=false; S.i=0; S.c=0; STEPS=build(); }
    save(); render(); return;
  }
  if(t.dataset.set){
    if(S.started && t.dataset.set!==S.set){ S.started=false; S.i=0; S.c=0; }
    S.set=t.dataset.set; STEPS=build(); save(); render(); return;
  }
  var a=t.dataset.act;
  if(a==='start'||a==='restart') start();
  else if(a==='resume'){ STEPS=build(S.set); S.view='pray'; render(); }
  else if(a==='next') next();
  else if(a==='back') back();
  else if(a==='say'){ S.say=!S.say; save(); render(); }
  else if(a==='ics') downloadIcs();
  else if(a==='notif') toggleNotif();
  else if(a==='auto'){ S.auto=!S.auto; render(); }
  else if(a==='slower'){ S.pace=Math.min(2.5, Math.round((S.pace+0.3)*10)/10); save(); render(); }
  else if(a==='faster'){ S.pace=Math.max(0.6, Math.round((S.pace-0.3)*10)/10); save(); render(); }
  else if(a==='ros'){ OVERVIEW=!OVERVIEW; ROS.classList.toggle('big',OVERVIEW); wake(); }
  else if(a==='reset'){ S.i=0; S.c=0; STEPS=build(); save(); render(); }
  else if(a==='angelus'){ S.view='angelus'; render(); }
  else if(a==='album'){ S.view='album'; render(); }
  else if(a==='clocklock'){ clkLock=!clkLock; if(clkLock) clkFrozen=clockText(); render(); }
  else if(a==='export') exportData();
  else if(a==='import'){ var f=document.getElementById('impFile'); if(f) f.click(); }
  else if(a==='home'){ S.view='home'; render(); }
  else if(a==='finish'){ S.view='home'; S.set=todaySet; STEPS=build(S.set); render(); }
});
app.addEventListener('change', function(e){
  var t=e.target;
  if(t && (t.id==='remH' || t.id==='remM')){ var H=document.getElementById('remH'), M=document.getElementById('remM'); if(H&&M){ S.remTime=pad2(+H.value)+':'+pad2(+M.value); save(); } return; }
  if(t && t.id==='impFile' && t.files && t.files[0]){ importData(t.files[0]); }
});
document.addEventListener('keydown', function(e){
  if(S.view!=='pray') return;
  if(e.key==='ArrowRight'||e.key===' '){ if(document.activeElement && document.activeElement.tagName==='BUTTON' && e.key===' ') return; e.preventDefault(); next(); }
  else if(e.key==='ArrowLeft'){ back(); }
});

/* ---------- Áudio (voz do aparelho) ---------- */
function voiceSeg(){
  var o=[['f','Feminina'],['m','Masculina']];
  return '<div class="seg" role="group" aria-label="Voz">'+o.map(function(x){
    return '<button data-voice="'+x[0]+'" aria-pressed="'+(S.voice===x[0])+'">'+x[1]+'</button>';
  }).join('')+'</div>';
}
/* Latim eclesiástico lido por voz italiana: ae vira e, ti+vogal vira zi (gratia = gratsia). */
function latinForSpeech(t){
  return t.replace(/æ/g,'e').replace(/Æ/g,'E').replace(/œ/g,'e')
          .replace(/([^stxSTX])ti(?=[aeiouáéíóú])/g,'$1zi');
}
var FEM=/alice|federica|paola|elsa|ione|isabella|francesca|female|fem|joana|francisca|luciana|vit[oó]ria|camila|carla|google.*(it|pt)-.*-x-.*[bd]-/i;
var MAS=/luca|cosimo|diego|marco|giorgio|reed|felipe|jorge|daniel|ricardo|antonio|cristiano|male|masc/i;
function pickVoice(list, g){
  var f=list.filter(function(v){ return g==='f' ? FEM.test(v.name) : (MAS.test(v.name)&&!/female|fem/i.test(v.name)); });
  return f[0]||null;
}
if('speechSynthesis' in window) speechSynthesis.getVoices();

/* ---------- Lembrete das 20:10 ---------- */
var REM_TITLE='Boa noite, noia', REM_BODY='Hora do terço';
function pad2(n){ return String(n).padStart(2,'0'); }
function icsText(){
  var d=new Date(), ymd=d.getFullYear()+pad2(d.getMonth()+1)+pad2(d.getDate());
  var stamp=d.toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  var hm=(S.remTime||'20:10').split(':'), H=+hm[0]||0, M=+hm[1]||0;
  var endM=(H*60+M+20)%1440;
  var start=pad2(H)+pad2(M)+'00', end=pad2(Math.floor(endM/60))+pad2(endM%60)+'00';
  var msg='Boa noite\\, noia! Hora do terço';
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//terco-do-dia//PT','CALSCALE:GREGORIAN','BEGIN:VEVENT',
    'UID:terco-diario@terco-do-dia','DTSTAMP:'+stamp,'DTSTART:'+ymd+'T'+start,'DTEND:'+ymd+'T'+end,'RRULE:FREQ=DAILY',
    'SUMMARY:'+msg,'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+msg,'TRIGGER:PT0S','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
}
function downloadIcs(){
  try{
    var url=URL.createObjectURL(new Blob([icsText()],{type:'text/calendar;charset=utf-8'}));
    var a=document.createElement('a'); a.href=url; a.download='terco-'+(S.remTime||'20:10').replace(':','h')+'.ics';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); },4000);
  }catch(e){}
}
function timeSelect(){
  var hm=(S.remTime||'20:10').split(':'), H=+hm[0]||0, M=+hm[1]||0, h='', m='', i;
  for(i=0;i<24;i++){ h+='<option value="'+i+'"'+(i===H?' selected':'')+'>'+pad2(i)+'</option>'; }
  for(i=0;i<60;i++){ m+='<option value="'+i+'"'+(i===M?' selected':'')+'>'+pad2(i)+'</option>'; }
  return '<span class="timesel"><select id="remH" aria-label="Hora">'+h+'</select><b>:</b><select id="remM" aria-label="Minuto">'+m+'</select></span>';
}
function notifLabel(){
  if(!('Notification' in window)) return 'Aviso indisponível neste navegador';
  if(Notification.permission==='denied') return 'Avisos bloqueados no navegador';
  return (S.notif&&Notification.permission==='granted') ? 'Aviso com o app aberto: ligado' : 'Ativar aviso com o app aberto';
}
function fire(test){
  var opts={body:test?('Aviso ligado. Toca todo dia às '+S.remTime+'.'):REM_BODY, tag:'terco', icon:'icon-192.png'};
  try{
    if(navigator.serviceWorker && navigator.serviceWorker.getRegistration){
      navigator.serviceWorker.getRegistration().then(function(r){
        if(r) r.showNotification(REM_TITLE,opts); else new Notification(REM_TITLE,opts);
      }).catch(function(){});
    } else new Notification(REM_TITLE,opts);
  }catch(e){}
}
function toggleNotif(){
  if(!('Notification' in window)||Notification.permission==='denied') return;
  if(S.notif){ S.notif=false; save(); render(); return; }
  Notification.requestPermission().then(function(r){ S.notif=(r==='granted'); save(); if(S.notif) fire(true); render(); });
}
setInterval(function(){ var el=document.getElementById('clocktime'); if(el && !clkLock) el.textContent=clockText(); }, 1000);
var lastFired='';
setInterval(function(){
  if(!S.notif||!('Notification' in window)||Notification.permission!=='granted') return;
  var n=new Date(), k=n.getFullYear()+'-'+n.getMonth()+'-'+n.getDate();
  var hm=(S.remTime||'20:10').split(':');
  if(n.getHours()===(+hm[0])&&n.getMinutes()===(+hm[1])&&lastFired!==k){ lastFired=k; fire(false); }
},15000);
try{ if('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(function(){}); }catch(e){}

load();
STEPS=build(S.set);
if(S.i>=STEPS.length) S.i=0;
render();
</script>
